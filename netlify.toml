[build]
  publish = "public"
  functions = "netlify/functions"
  command = "echo 'Sin compilación: sitio estático + funciones'"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
